<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E3F3A"/>
      <stop offset="100%" stop-color="#1B6B63"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bgGrad)"/>

  <!-- soft bokeh circles -->
  <circle cx="1100" cy="40" r="70" fill="#ffffff" opacity="0.04"/>
  <circle cx="60" cy="220" r="90" fill="#ffffff" opacity="0.04"/>
  <circle cx="950" cy="210" r="30" fill="#ffffff" opacity="0.05"/>

  <!-- bank icon (left) -->
  <g transform="translate(90,70)">
    <polygon points="60,0 120,34 0,34" fill="#EAF2F0"/>
    <rect x="8" y="40" width="14" height="60" fill="#EAF2F0"/>
    <rect x="34" y="40" width="14" height="60" fill="#EAF2F0"/>
    <rect x="60" y="40" width="14" height="60" fill="#EAF2F0"/>
    <rect x="86" y="40" width="14" height="60" fill="#EAF2F0"/>
    <rect x="0" y="106" width="120" height="12" rx="3" fill="#EAF2F0"/>
  </g>

  <!-- dashed flow line -->
  <line x1="230" y1="130" x2="500" y2="130" stroke="#7BC67E" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="620" y1="130" x2="880" y2="130" stroke="#7BC67E" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- bar chart + shield (middle) -->
  <g transform="translate(520,55)">
    <rect x="0" y="80" width="18" height="40" rx="3" fill="#9FD9A0"/>
    <rect x="26" y="55" width="18" height="65" rx="3" fill="#9FD9A0"/>
    <rect x="52" y="30" width="18" height="90" rx="3" fill="#7BC67E"/>
    <rect x="78" y="10" width="18" height="110" rx="3" fill="#5CB260"/>
    <g transform="translate(100,-10)">
      <path d="M25 0 L50 10 V35 C50 55 38 68 25 75 C12 68 0 55 0 35 V10 Z" fill="#EAF2F0"/>
      <path d="M14 38 L22 46 L37 28" stroke="#1B6B63" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- chat bubble (right) -->
  <g transform="translate(900,70)">
    <rect x="0" y="0" width="130" height="80" rx="18" fill="#EAF2F0"/>
    <polygon points="24,80 24,102 50,80" fill="#EAF2F0"/>
    <circle cx="35" cy="40" r="7" fill="#1B6B63"/>
    <circle cx="65" cy="40" r="7" fill="#1B6B63"/>
    <circle cx="95" cy="40" r="7" fill="#1B6B63"/>
  </g>
</svg>
